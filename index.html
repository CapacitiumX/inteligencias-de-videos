<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Comando de Inteligencia - Live AI Analyzer</title>
    <style>
        :root {
            --bg-deep: #070a13;
            --bg-card: #0f1626;
            --border-neon: #1e293b;
            --red-yt: #ff0000;
            --gold: #f59e0b;
            --text-white: #f8fafc;
            --text-gray: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-white);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--text-white);
            letter-spacing: 1px;
        }

        /* Panel de Configuración y URLs */
        .panel-control {
            background-color: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-neon);
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }

        .input-key-wrapper {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .inputs-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .inputs-row { grid-template-columns: 1fr; }
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-box label {
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-gray);
            font-weight: bold;
        }

        .input-box input {
            background-color: var(--bg-deep);
            border: 1px solid var(--border-neon);
            padding: 12px;
            color: white;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-box input:focus {
            border-color: var(--red-yt);
        }

        .btn-core {
            background-color: var(--red-yt);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-core:hover {
            background-color: #cc0000;
        }

        /* Estado de Carga */
        .loading-status {
            text-align: center;
            padding: 20px;
            color: var(--gold);
            font-weight: bold;
            display: none;
            font-size: 1.1rem;
        }

        /* Workspace Espejo */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            display: none;
        }

        @media (max-width: 900px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .card-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-neon);
            padding: 25px;
            border-radius: 12px;
        }

        .card-panel.viral-highlight {
            border-color: rgba(245, 158, 11, 0.4);
        }

        .tag {
            background-color: #2563eb;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tag.viral { background-color: var(--gold); color: black; }
        
        .thumb-holder {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            margin: 15px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-neon);
        }

        .thumb-holder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h3 {
            margin-bottom: 12px;
            font-size: 1.2rem;
        }

        .report-space {
            background-color: var(--bg-deep);
            padding: 20px;
            border-radius: 8px;
            min-height: 200px;
            font-size: 0.95rem;
            line-height: 1.6;
            border-left: 4px solid var(--red-yt);
            white-space: pre-line; /* Mantiene los saltos de línea de la IA */
        }
    </style>
</head>
<body>

    <header>
        <h1>CENTRO DE COMANDO ALGORÍTMICO</h1>
        <p>Auditoría Profunda de Videos con Inteligencia Artificial Activa</p>
    </header>

    <main class="panel-control">
        <!-- Input de la API Key necesario para procesar con OpenAI -->
        <div class="input-box input-key-wrapper">
            <label for="api-key">TU LLAVE API DE OPENAI (Asegura el procesamiento real):</label>
            <input type="password" id="api-key" placeholder="sk-proj-...">
        </div>

        <div class="inputs-row">
            <div class="input-box">
                <label>URL DE TU VIDEO (Bajo Rendimiento):</label>
                <input type="text" id="url-mio" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            <div class="input-box">
                <label>URL DEL VIDEO VIRAL (Competencia / Éxito):</label>
                <input type="text" id="url-viral" placeholder="https://youtu.be/...">
            </div>
        </div>
        <button class="btn-core" onclick="iniciarAuditoriaCompleta()">EJECUTAR AUDITORÍA PROFUNDA FRENTE A FRENTE</button>
    </main>

    <div id="status-console" class="loading-status"></div>

    <!-- Área de resultados dinámicos -->
    <section class="workspace" id="workspace-grid">
        <div class="card-panel">
            <span class="tag">Tu Canal</span>
            <div class="thumb-holder">
                <img id="view-thumb-mio" src="" alt="Tu miniatura">
            </div>
            <h3>Diagnóstico Real de tu Video</h3>
            <div class="report-space" id="box-analisis-mio">Procesando...</div>
        </div>

        <div class="card-panel viral-highlight">
            <span class="tag viral">Logro del Éxito</span>
            <div class="thumb-holder">
                <img id="view-thumb-viral" src="" alt="Miniatura viral">
            </div>
            <h3>Análisis del Impacto Viral</h3>
            <div class="report-space" id="box-analisis-viral" style="border-left-color: var(--gold);">Procesando...</div>
        </div>
    </section>

    <script>
        // Extraer ID de YouTube
        function obtenerID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Obtener subtítulos usando un servicio proxy de transcripciones públicas
        async function fetchSubtitulos(videoID) {
            try {
                const response = await fetch(`https://shared-transcript-api.vercel.app/api/transcript?v=${videoID}`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                // Juntar líneas de subtítulos
                return data.transcript.map(t => t.text).join(" ").substring(0, 3500);
            } catch (e) {
                return "No hay transcripción disponible o el video tiene subtítulos desactivados.";
            }
        }

        async function iniciarAuditoriaCompleta() {
            const apiKey = document.getElementById('api-key').value.trim();
            const urlMio = document.getElementById('url-mio').value.trim();
            const urlViral = document.getElementById('url-viral').value.trim();

            if (!apiKey) { return alert("Por favor introduce tu OpenAI API Key."); }
            if (!urlMio || !urlViral) { return alert("Introduce ambas URLs de YouTube."); }

            const idMio = obtenerID(urlMio);
            const idViral = obtenerID(urlViral);

            if (!idMio || !idViral) { return alert("Las URLs de YouTube no parecen válidas."); }

            const consoleStatus = document.getElementById('status-console');
            const grid = document.getElementById('workspace-grid');

            grid.style.display = 'none';
            consoleStatus.style.display = 'block';

            // Actualizar imágenes reales en vivo
            document.getElementById('view-thumb-mio').src = `https://img.youtube.com/vi/${idMio}/maxresdefault.jpg`;
            document.getElementById('view-thumb-viral').src = `https://img.youtube.com/vi/${idViral}/maxresdefault.jpg`;

            try {
                consoleStatus.innerText = "⏳ Extrayendo subtítulos reales directamente desde YouTube...";
                const guionMio = await fetchSubtitulos(idMio);
                const guionViral = await fetchSubtitulos(idViral);

                consoleStatus.innerText = "🧠 Conectando con la IA de OpenAI para análisis profundo...";

                // Preparación de la petición HTTP directa a la API de OpenAI
                const promptQuery = `
                Actúa como un experto consultor del algoritmo de YouTube y psicología de audiencias.
                Analiza y compara estos dos videos basándote en la información real provista:

                VIDEO PROPIO (Bajo rendimiento) - ID: ${idMio}
                Texto inicial del video: "${guionMio}"

                VIDEO VIRAL COMPETENCIA (Éxito Masivo) - ID: ${idViral}
                Texto inicial del video: "${guionViral}"

                Instrucciones estrictas de respuesta:
                Devuelve tu análisis dividido EXACTAMENTE en dos partes, usando el marcador [CORTE] para separarlas.

                PARTE 1 (Análisis de mi video): Analiza críticamente el gancho de mi video. Dime por qué la gente no se quedó o por qué el título/idea falló en enganchar rápido. Sé directo.
                [CORTE]
                PARTE 2 (Análisis del video viral): Explica el 'Logro del Éxito' de la competencia. Qué disparador psicológico, curiosidad o factor shock usaron en su guion para acumular visitas y cómo revolucionó su retención. Qué debemos copiar o aprender de ellos.
                `;

                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [{ role: "user", content: promptQuery }],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    throw new Error("Error en la autenticación o límites de tu API Key.");
                }

                const openAiData = await response.json();
                const textoCompletoIA = openAiData.choices[0].message.content;

                // Dividir la respuesta de la IA para ponerla en sus respectivas columnas espejo
                const partes = textoCompletoIA.split("[CORTE]");

                document.getElementById('box-analisis-mio').innerText = partes[0] ? partes[0].trim() : textoCompletoIA;
                document.getElementById('box-analisis-viral').innerText = partes[1] ? partes[1].trim() : "Análisis procesado exitosamente en el bloque izquierdo.";

                consoleStatus.style.display = 'none';
                grid.style.display = 'grid';

            } catch (error) {
                alert("Hubo un problema: " + error.message);
                consoleStatus.style.display = 'none';
            }
        }
    </script>
</body>
</html>
